bio: |
  👋 **Hey there!**

  I'm a second-year Master's student at [**Carnegie Mellon University (CMU)**](https://www.cmu.edu/).
  I previously graduated from [**Nanyang Technological University (NTU)**](https://www.ntu.edu.sg/),
  where I had the opportunity to work under [**Prof. Ziwei Liu**](https://liuziwei7.github.io/) in [**S-Lab**](https://www.mmlab-ntu.com/).
  At CMU, I've been involved with some exciting research at [**XuLab**](https://xulabs.github.io/) under [**Prof. Min Xu**](https://xulabs.github.io/min-xu/).
  I'm actively collaborating with [**Dr. Liang Pan**](https://scholar.google.com/citations?user=lSDISOcAAAAJ&hl=en) on several research projects.

  Right now, my primary focus is on **3D generation** and **world models**. Beyond research, I love building cool projects and exploring music—I'm currently learning to play the guitar!

  I'm always up for an interesting conversation, a brainstorming session, or a potential collaboration—feel free to connect! 